services:
  - type: web
    name: wbffmh-appointment-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: ap-southeast-1
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_PUBLIC_BASE_URL
        sync: false
      - key: JAAS_APP_ID
        sync: false
      - key: JAAS_KEY_ID
        sync: false
      - key: JAAS_PRIVATE_KEY_BASE64
        sync: false
      - key: JAAS_TENANT
        sync: false
      - key: JAAS_DOMAIN
        value: 8x8.vc
      - key: JAAS_WEBHOOK_SECRET
        sync: false
      - key: JAAS_RECORDING_ALLOWED_HOSTS
        value: 8x8.vc,jitsi.net
      - key: GOOGLE_DRIVE_CLIENT_ID
        sync: false
      - key: GOOGLE_DRIVE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_DRIVE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_DRIVE_TARGET_EMAIL
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: MEDICINE_DATASET_URL
        value: https://raw.githubusercontent.com/junioralive/Indian-Medicine-Dataset/refs/heads/main/DATA/indian_medicine_data.csv
      - key: APP_TIMEZONE
        value: Asia/Kolkata
  - type: cron
    name: wbffmh-nightly-maintenance
    runtime: node
    rootDir: backend
    buildCommand: npm install
    schedule: "30 18 * * *"
    startCommand: node scripts/nightly-maintenance.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Kolkata
